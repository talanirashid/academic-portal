name: academic_portal
description: "Pakistan Computer Science Academy (PCSA) Academic Portal & Resource Hub"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  cloud_functions: ^5.2.5
  file_picker: ^8.1.7
  youtube_player_iframe: ^5.2.1
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  syncfusion_flutter_pdfviewer: ^28.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
