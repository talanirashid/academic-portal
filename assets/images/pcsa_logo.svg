<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006633"/>
      <stop offset="100%" stop-color="#00381B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D423"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- Outer Shield Border -->
  <path d="M256,24 C372,24 456,64 456,152 C456,312 360,424 256,488 C152,424 56,312 56,152 C56,64 140,24 256,24 Z"
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Inner Gold Accent Rim -->
  <path d="M256,44 C354,44 434,78 434,156 C434,296 348,396 256,458 C164,396 78,296 78,156 C78,78 158,44 256,44 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Crescent & Star (National Identity at Apex) -->
  <path d="M246,72 A32,32 0 1,0 274,116 A26,26 0 1,1 246,72 Z" fill="url(#goldGrad)"/>
  <polygon points="278,84 282,94 292,94 284,100 287,110 278,104 269,110 272,100 264,94 274,94" fill="#FFFFFF"/>

  <!-- Circuit Trace Lines & Logic Nodes -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="210" x2="256" y2="135"/>
    <circle cx="256" cy="135" r="6" fill="url(#goldGrad)"/>
    <path d="M210,230 L210,180 L180,150" fill="none"/>
    <circle cx="180" cy="150" r="5" fill="url(#goldGrad)"/>
    <path d="M302,230 L302,180 L332,150" fill="none"/>
    <circle cx="332" cy="150" r="5" fill="url(#goldGrad)"/>
  </g>

  <!-- Open Textbook (Academic Base) -->
  <path d="M120,310 C180,285 240,295 256,315 C272,295 332,285 392,310 L392,350 C332,325 272,335 256,355 C240,335 180,325 120,350 Z"
        fill="#FFFFFF"/>
  <path d="M256,315 L256,355" stroke="#00381B" stroke-width="4"/>

  <!-- Monogram Banner -->
  <text x="256" y="270" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', serif" font-size="52" font-weight="900" fill="url(#goldGrad)" letter-spacing="8">PCSA</text>
  <text x="256" y="415" text-anchor="middle" font-family="'Poppins', 'Inter', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" letter-spacing="3">ACADEMIC PRESS</text>
</svg>
